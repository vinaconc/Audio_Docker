name: Despertar GPU de Kaggle al llegar Audio de R2

on:
  repository_dispatch:
    types: [nuevo_audio_r2]

jobs:
  ensamblar-y-lanzar:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ 1. Clonar Repositorio de Infraestructura (Audio_Docker)
        uses: actions/checkout@v4

      - name: 🐍 2. Configurar Python Ligero
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 3. Instalar la API de Kaggle
        run: pip install --no-cache-dir kaggle

      - name: Clonar Repositorio de Codigo
        uses: actions/checkout@v4
        with:
          repository: vinaconc/chord-analyzer
          token: ${{ secrets.PAT_CHORD_ANALYZER }}
          path: repo_codigo

      - name: Preparar Entorno para Kaggle
        env:
          TMP_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TMP_R2_KEY: ${{ secrets.R2_ACCESS_KEY }}
          TMP_R2_SECRET: ${{ secrets.R2_SECRET_KEY }}
          TMP_R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TMP_GITHUB_PAT: ${{ secrets.PAT_CHORD_ANALYZER }}
        run: |
          # 1. Copiamos SOLO el script a la raíz
          cp repo_codigo/procesaraudio.py ./
          
          # 2. Inyectamos las variables (incluyendo el token de GitHub)
          echo "archivo = '${{ github.event.client_payload.archivo }}'" > procesaraudio_final.py
          echo "r2_endpoint = '$TMP_R2_ENDPOINT'" >> procesaraudio_final.py
          echo "r2_access_key = '$TMP_R2_KEY'" >> procesaraudio_final.py
          echo "r2_secret_key = '$TMP_R2_SECRET'" >> procesaraudio_final.py
          echo "r2_bucket = '$TMP_R2_BUCKET'" >> procesaraudio_final.py
          echo "github_pat = '$TMP_GITHUB_PAT'" >> procesaraudio_final.py
          
          cat procesaraudio.py >> procesaraudio_final.py
          mv procesaraudio_final.py procesaraudio.py
          
          # 3. Metadata
          echo '{
            "id": "workercrema/audio-worker-prod",
            "title": "audio-worker-prod",
            "code_file": "procesaraudio.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "keywords": [],
            "dataset_sources": [],
            "kernel_sources": [],
            "competition_sources": [],
            "image_type": "custom",
            "image_id": "ghcr.io/vinaconc/audio_docker:latest"
          }' > kernel-metadata.json

      - name: 🚀 4. Enviar Orden de Ejecución a la GPU de Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          
          kaggle kernels push -p .
