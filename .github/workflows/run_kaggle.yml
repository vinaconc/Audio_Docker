name: Despertar GPU de Kaggle al llegar Audio de R2

on:
  repository_dispatch:
    types: [nuevo_audio_r2]

jobs:
  ensamblar-y-lanzar:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ 1. Clonar Repositorio de Infraestructura (Audio_Docker)
        uses: actions/checkout@v4

      - name: 🐍 2. Configurar Python Ligero
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 3. Instalar la API de Kaggle
        run: pip install --no-cache-dir kaggle

      - name: Clonar Repositorio de Codigo
        uses: actions/checkout@v4
        with:
          repository: vinaconc/chord-analyzer
          token: ${{ secrets.PAT_CHORD_ANALYZER }}
          path: repo_codigo

      - name: Preparar Entorno para Kaggle
        run: |
          # 1. Copiamos todo a la raíz
          cp -r repo_codigo/* ./
          rm -rf repo_codigo
          
          # 2. Creamos el job.json
          echo '${{ toJson(github.event.client_payload) }}' > job.json
          
          # 3. FORZAMOS LA CREACIÓN DEL METADATA (Apuntando al .py y al usuario correcto)
          echo '{
            "id": "workercrema/procesaraudio",
            "title": "procesaraudio",
            "code_file": "procesaraudio.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "keywords": [],
            "dataset_sources": [],
            "kernel_sources": [],
            "competition_sources": [],
            "image_type": "custom",
            "image_id": "ghcr.io/vinaconc/audio_docker:latest"
          }' > kernel-metadata.json
          
          # 4. VERIFICACIÓN CRÍTICA: ¿Existe el archivo .py en la raíz?
          echo "=== Archivos en la carpeta ==="
          ls -la
          echo "=== Contenido del Metadata generado ==="
          cat kernel-metadata.json

      - name: 🚀 5. Enviar Orden de Ejecución a la GPU de Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }} # Asegúrate de que este secreto sea 'workercrema'
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          
          # Hacemos el push directamente (SIN hacer 'kaggle kernels pull' para no sobrescribir el .py)
          kaggle kernels push -p .
