name: Despertar GPU de Kaggle al llegar Audio de R2

on:
  # 🔥 Esto permite que Cloudflare R2 encienda este flujo mediante un Webhook (API)
  repository_dispatch:
    types: [nuevo_audio_r2]

jobs:
  ensamblar-y-lanzar:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ 1. Clonar Repositorio de Infraestructura (Audio_Docker)
        uses: actions/checkout@v4

      - name: 🐍 2. Configurar Python Ligero
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 3. Instalar la API de Kaggle
        run: |
          pip install --no-cache-dir kaggle

      - name: Clonar Repositorio de Codigo
        uses: actions/checkout@v4
        with:
          repository: vinaconc/chord-analyzer
          token: ${{ secrets.PAT_CHORD_ANALYZER }}
          path: repo_codigo

      # 🛠️ UNIFICAMOS EN UN SOLO PASO LIMPIO Y SEGURO:
      # 🛠️ BLOQUE BLINDADO: Fuerza la creación del metadata correcto en la raíz
      - name: Preparar Entorno para Kaggle
        run: |
          # 1. Copiamos todo el código clonado a la raíz
          cp -r repo_codigo/* ./
          
          # 2. Borramos la subcarpeta temporal
          rm -rf repo_codigo
          
          # 3. Inyectamos de forma segura el JSON con el payload del audio
          echo '${{ toJson(github.event.client_payload) }}' > job.json
          
          # 4. BLINDAJE EXTRA: Forzamos la sobreescritura del metadata correcto para que Kaggle no lea basura
          cat << 'EOF' > kernel-metadata.json
          {
            "id": "vinaconc/procesaraudio",
            "title": "procesaraudio",
            "code_file": "procesaraudio.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": "true",
            "enable_gpu": "true",
            "enable_internet": "true",
            "keywords": [],
            "dataset_sources": [],
            "kernel_sources": [],
            "competition_sources": [],
            "image_type": "custom",
            "image_id": "ghcr.io/vinaconc/audio_docker:latest"
          }
          EOF
          
          # 🔐 INYECCIÓN DE CONTROL DE TU ALMACENAMIENTO (R2):
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          
          # 🔐 INYECCIÓN DE CONTROL DE TU BASE DE DATOS:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          
          # 🔐 INYECCIÓN DE CONTROL DE ALERTAS TELEGRAM:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          
          # La API toma el lote, el código y despierta tu Docker en segundos
          kaggle kernels push -p .
