name: Despertar GPU de Kaggle al llegar Audio de R2

on:
  repository_dispatch:
    types: [nuevo_audio_r2]

jobs:
  ensamblar-y-lanzar:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ 1. Clonar Repositorio de Infraestructura (Audio_Docker)
        uses: actions/checkout@v4

      - name: 🐍 2. Configurar Python Ligero
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 3. Instalar la API de Kaggle
        run: |
          pip install --no-cache-dir kaggle

      - name: Clonar Repositorio de Codigo
        uses: actions/checkout@v4
        with:
          repository: vinaconc/chord-analyzer
          token: ${{ secrets.PAT_CHORD_ANALYZER }}
          path: repo_codigo

      - name: Preparar Entorno para Kaggle
        env:
          TMP_DB_USER: ${{ secrets.DB_USER }}
          TMP_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          TMP_DB_HOST: ${{ secrets.DB_HOST }}
          TMP_DB_NAME: ${{ secrets.DB_NAME }}
          TMP_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TMP_R2_KEY: ${{ secrets.R2_ACCESS_KEY }}
          TMP_R2_SECRET: ${{ secrets.R2_SECRET_KEY }}
          TMP_R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TMP_GITHUB_PAT: ${{ secrets.PAT_CHORD_ANALYZER }}
          TMP_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TMP_TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Copiamos el Notebook
          cp repo_codigo/setup_kaggle.ipynb ./procesaraudio.ipynb
          
          # Inyectamos las variables con los nombres clásicos
          python -c "
import json
with open('procesaraudio.ipynb', 'r') as f:
    nb = json.load(f)

vars_code = '''
import os
os.environ['DB_USER'] = '$TMP_DB_USER'
os.environ['DB_PASSWORD'] = '$TMP_DB_PASSWORD'
os.environ['DB_HOST'] = '$TMP_DB_HOST'
os.environ['DB_NAME'] = '$TMP_DB_NAME'
os.environ['DB_PORT'] = '5432'

os.environ['R2_ENDPOINT'] = '$TMP_R2_ENDPOINT'
os.environ['R2_ACCESS_KEY'] = '$TMP_R2_KEY'
os.environ['R2_SECRET_KEY'] = '$TMP_R2_SECRET'
os.environ['R2_BUCKET'] = '$TMP_R2_BUCKET'
os.environ['GIT_TOKEN'] = '$TMP_GITHUB_PAT'
os.environ['TELEGRAM_BOT_TOKEN'] = '$TMP_TELEGRAM_TOKEN'
os.environ['TELEGRAM_CHAT_ID'] = '$TMP_TELEGRAM_CHAT'
'''

nb['cells'].insert(0, {
    'cell_type': 'code',
    'execution_count': None,
    'metadata': {},
    'outputs': [],
    'source': [vars_code]
})

with open('procesaraudio.ipynb', 'w') as f:
    json.dump(nb, f)
"
          
          cat << 'EOF' > kernel-metadata.json
          {
            "id": "workercrema/procesaraudio",
            "title": "procesaraudio",
            "code_file": "procesaraudio.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "keywords": [],
            "dataset_sources": [],
            "kernel_sources": [],
            "competition_sources": [],
            "image_type": "latest",
            "image_id": ""
          }
          EOF      
      - name: 🚀 5. Enviar Orden de Ejecución a la GPU de Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          
          kaggle kernels push -p .
