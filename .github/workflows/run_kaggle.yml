name: Despertar GPU de Kaggle al llegar Audio de R2

on:
  repository_dispatch:
    types: [nuevo_audio_r2]

jobs:
  ensamblar-y-lanzar:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ 1. Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🐍 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 3. Instalar la API de Kaggle
        run: pip install --no-cache-dir kaggle

      - name: Clonar Repositorio de Código
        uses: actions/checkout@v4
        with:
          repository: vinaconc/chord-analyzer
          token: ${{ secrets.PAT_CHORD_ANALYZER }}
          path: repo_codigo

      - name: Preparar Notebook e Inyectar Secretos
        env:
          TMP_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TMP_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TMP_R2_KEY: ${{ secrets.R2_ACCESS_KEY }}
          TMP_R2_SECRET: ${{ secrets.R2_SECRET_KEY }}
          TMP_R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TMP_GITHUB_PAT: ${{ secrets.PAT_CHORD_ANALYZER }}
          TMP_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TMP_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cp repo_codigo/procesaraudio.ipynb ./procesaraudio.ipynb
          
          # Ejecutamos el script que creamos en el Paso 1
          python inject_vars.py
          
          # Metadata
          echo '{
            "id": "workercrema/procesaraudio",
            "title": "procesaraudio",
            "code_file": "procesaraudio.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "keywords": [],
            "dataset_sources": [],
            "kernel_sources": [],
            "competition_sources": [],
            "image_type": "latest",
            "image_id": ""
          }' > kernel-metadata.json
      - name: 🚦 Marcar Kaggle como arrancando
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" <<'SQL'
          INSERT INTO worker_status (worker_id, last_heartbeat, state)
          VALUES ('kaggle-worker', NOW(), 'starting')
          ON CONFLICT (worker_id)
          DO UPDATE SET last_heartbeat = NOW(), state = 'starting';
          SQL
        

      - name: 🗄️ Crear job en Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUDIO_KEY: ${{ github.event.client_payload.key }}
        run: |
          if [ -z "$AUDIO_KEY" ]; then
            echo "::error::client_payload.key llegó vacío. Revisa lo que manda el Cloudflare Worker."
            exit 1
          fi
          psql "$DATABASE_URL" -v url="upload://$AUDIO_KEY" <<'SQL'
          INSERT INTO jobs (url, status, created_at)
          VALUES (:'url', 'pending', NOW());
          SQL


      - name: 🚀 5. Enviar Orden a Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          kaggle kernels push -p .
