name: Despertar GPU de Kaggle al llegar Audio de R2

on:
  repository_dispatch:
    types: [nuevo_audio_r2]

jobs:
  ensamblar-y-lanzar:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ 1. Clonar Repositorio de Infraestructura (Audio_Docker)
        uses: actions/checkout@v4

      - name: 🐍 2. Configurar Python Ligero
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 3. Instalar la API de Kaggle
        run: pip install --no-cache-dir kaggle

      - name: Clonar Repositorio de Codigo
        uses: actions/checkout@v4
        with:
          repository: vinaconc/chord-analyzer
          token: ${{ secrets.PAT_CHORD_ANALYZER }}
          path: repo_codigo

      - name: Preparar Entorno para Kaggle
        run: |
          cp -r repo_codigo/* ./
          rm -rf repo_codigo
          
          # Inyectamos el payload (job.json)
          echo '${{ toJson(github.event.client_payload) }}' > job.json
          
          # Verificamos qué contiene el job.json (para depurar)
          echo "=== Contenido de job.json ==="
          cat job.json
          
          # Metadata corregida (Sin comillas en los booleanos)
          cat << 'EOF' > kernel-metadata.json
          {
            "id": "vinaconc/procesaraudio",
            "title": "procesaraudio",
            "code_file": "procesaraudio.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "keywords": [],
            "dataset_sources": [],
            "kernel_sources": [],
            "competition_sources": [],
            "image_type": "custom",
            "image_id": "ghcr.io/vinaconc/audio_docker:latest"
          }
          EOF

      - name: 🚀 5. Enviar Orden de Ejecución a la GPU de Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          
          echo "⏳ Esperando alineación de servidores de Kaggle..."
          sleep 10
          
          kaggle kernels push -p .
