name: Despertar GPU de Kaggle al llegar Audio de R2

on:
  repository_dispatch:
    types: [nuevo_audio_r2]

jobs:
  ensamblar-y-lanzar:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ 1. Clonar Repositorio de Infraestructura (Audio_Docker)
        uses: actions/checkout@v4

      - name: 🐍 2. Configurar Python Ligero
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 3. Instalar la API de Kaggle
        run: pip install --no-cache-dir kaggle

      - name: Clonar Repositorio de Codigo
        uses: actions/checkout@v4
        with:
          repository: vinaconc/chord-analyzer
          token: ${{ secrets.PAT_CHORD_ANALYZER }}
          path: repo_codigo

      - name: Preparar Entorno para Kaggle
        run: |
          # 1. Copiamos todo a la raíz
          cp -r repo_codigo/* ./
          rm -rf repo_codigo
          
          # 2. INYECCIÓN DIRECTA: Metemos las variables en el propio script de Python
          python -c "
archivo = '${{ github.event.client_payload.archivo }}'
r2_id = '${{ secrets.R2_ACCOUNT_ID }}'
r2_key = '${{ secrets.R2_ACCESS_KEY_ID }}'
r2_secret = '${{ secrets.R2_SECRET_ACCESS_KEY }}'

with open('procesaraudio.py', 'r') as f:
    code = f.read()

injection = f'''
archivo = \"{archivo}\"
r2_account_id = \"{r2_id}\"
r2_access_key = \"{r2_key}\"
r2_secret_key = \"{r2_secret}\"
'''
# Inyectamos las variables justo después de los imports
code = code.replace('import sys\n', 'import sys\n' + injection, 1)

with open('procesaraudio.py', 'w') as f:
    f.write(code)
"
          
          # 3. FORZAMOS LA CREACIÓN DEL METADATA (Con ID nuevo para evitar caché)
          echo '{
            "id": "workercrema/audio-worker-prod",
            "title": "audio-worker-prod",
            "code_file": "procesaraudio.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "keywords": [],
            "dataset_sources": [],
            "kernel_sources": [],
            "competition_sources": [],
            "image_type": "custom",
            "image_id": "ghcr.io/vinaconc/audio_docker:latest"
          }' > kernel-metadata.json
          
          # 4. VERIFICACIÓN EN LOGS
          echo "=== Primeras líneas del script inyectado ==="
          head -n 15 procesaraudio.py
          echo "=== Metadata ==="
          cat kernel-metadata.json

      - name: 🚀 5. Enviar Orden de Ejecución a la GPU de Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          
          kaggle kernels push -p .
