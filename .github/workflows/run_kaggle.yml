name: Despertar GPU de Kaggle al llegar Audio de R2

on:
  repository_dispatch:
    types: [nuevo_audio_r2]

jobs:
  ensamblar-y-lanzar:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ 1. Clonar Repositorio de Infraestructura
        uses: actions/checkout@v4

      - name: 🐍 2. Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 3. Instalar la API de Kaggle
        run: pip install --no-cache-dir kaggle

      - name: Clonar Repositorio de Código (chord-analyzer)
        uses: actions/checkout@v4
        with:
          repository: vinaconc/chord-analyzer
          token: ${{ secrets.PAT_CHORD_ANALYZER }}
          path: repo_codigo

      - name: Preparar Notebook e Inyectar Secretos
        env:
          TMP_DB_USER: ${{ secrets.DB_USER }}
          TMP_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          TMP_DB_HOST: ${{ secrets.DB_HOST }}
          TMP_DB_NAME: ${{ secrets.DB_NAME }}
          TMP_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TMP_R2_KEY: ${{ secrets.R2_ACCESS_KEY }}
          TMP_R2_SECRET: ${{ secrets.R2_SECRET_KEY }}
          TMP_R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TMP_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TMP_TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TMP_GITHUB_PAT: ${{ secrets.PAT_CHORD_ANALYZER }}
        run: |
          # 1. Copiamos tu Notebook al directorio de trabajo
          cp repo_codigo/setup_kaggle.ipynb ./procesaraudio.ipynb
          
          # 2. Inyectamos los secretos en la primera celda usando Python
          cat << 'PYEOF' > inject_vars.py
import json
import os

with open('procesaraudio.ipynb', 'r') as f:
    nb = json.load(f)

# Creamos la celda leyendo las variables del entorno de GitHub
codigo_celda = "import os\n"
variables = ["DB_USER", "DB_PASSWORD", "DB_HOST", "DB_NAME", "GIT_TOKEN", "R2_ENDPOINT", "R2_ACCESS_KEY", "R2_SECRET_KEY", "R2_BUCKET", "TELEGRAM_BOT_TOKEN", "TELEGRAM_CHAT_ID"]

for var in variables:
    valor = os.environ.get(f"TMP_{var}", "")
    codigo_celda += f"os.environ['{var}'] = '{valor}'\n"

# Insertamos la celda al principio del Notebook
nb['cells'].insert(0, {
    'cell_type': 'code',
    'execution_count': None,
    'metadata': {},
    'outputs': [],
    'source': [codigo_celda]
})

with open('procesaraudio.ipynb', 'w') as f:
    json.dump(nb, f)
print("✅ Secretos inyectados en el Notebook.")
PYEOF
          
          # 3. Ejecutamos la inyección
          python inject_vars.py
          rm inject_vars.py
          
          # 4. Creamos el metadata SIN DOCKER (usando la imagen oficial de Kaggle)
          cat << 'EOF' > kernel-metadata.json
          {
            "id": "workercrema/procesaraudio",
            "title": "procesaraudio",
            "code_file": "procesaraudio.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true,
            "keywords": [],
            "dataset_sources": [],
            "kernel_sources": [],
            "competition_sources": [],
            "image_type": "latest",
            "image_id": ""
          }
          EOF

      - name: 🚀 5. Enviar Orden de Ejecución a la GPU de Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          
          kaggle kernels push -p .
