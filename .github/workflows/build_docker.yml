name: Build and Push Docker Audio Image

on:
  push:
    branches:
      - main # Se activa automáticamente al subir cambios a la rama principal

env:
  REGISTRY: ghcr.io
  # 🔥 Forzamos el nombre del contenedor estrictamente en minúsculas independientemente de GitHub
  IMAGE_NAME: vinaconc/audio_docker 
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Permiso obligatorio para que GitHub pueda guardar tu Docker final

    steps:
      - name: ⬇️ Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🐋 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: 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 # Contraseña automática interna de GitHub

      - name: 📦 Compilar y Subir Imagen Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha # Usa la caché interna para compilar más rápido en el futuro
          cache-to: type=gha,mode=max
